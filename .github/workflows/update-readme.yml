# Visit https://github.com/lowlighter/metrics/blob/master/action.yml for full reference
# Activity plugin: use EndBug fork until lowlighter/metrics#1760 is merged
# (GitHub removed commits from PushEvent payloads in Oct 2025 → Unexpected error on @latest)
name: Recent Activity
on:
  schedule: [{ cron: "5 * * * *" }]
  workflow_dispatch:
  push: { branches: ["master", "main"] }
jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: EndBug/metrics@deb1c308cdceaf0431647ae50079abfc34b4415d
        with:
          filename: assets/metrics.plugin.activity.svg
          token: ${{ secrets.METRICS_TOKEN }}

          # Options
          user: MahmoudAbuelazm
          template: classic
          base: ""
          config_timezone: Africa/Cairo
          plugin_activity: yes
          plugin_activity_days: 31
          plugin_activity_filter: issue, pr, release, fork, review, ref/create
          plugin_activity_limit: 4
          plugin_activity_load: 300
          plugin_activity_visibility: public
